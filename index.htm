<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> التسجيل - تيم إعلام مبادرة كسلا تقرا</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header-with-logo">
            <div class="logo-placeholder">
                <img src="5764617002487058106.jpg" alt="شعار مبادرة كسلا" id="mainLogo"
                     onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'font-size:40px;\'>🎨</span>';" />
            </div>
            <div class="header-text">
                <h1>📋 التسجيل في تيم اﻹعلام</h1>
                <p class="subtitle">مبادرة كسلا تقرا</p>
            </div>
        </div>

        <!-- 1 2 3 4 -->
        <div class="step-indicator">
            <span class="step active" data-step="0">1</span>
            <span class="step" data-step="1">2</span>
            <span class="step" data-step="2">3</span>
            <span class="step" data-step="3">4</span>
        </div>

        <form id="multiStepForm" novalidate>
            <!-- ===== الخطوة 1: البيانات الشخصية ===== -->
            <div class="step-page active" data-step="0">
                <h2>📝 البيانات الشخصية</h2>
                
                <label>الاسم ....الرباعي *</label>
                <input type="text" name="fullName" required />

                <label>العمر *</label>
                <input type="number" name="age"  required min="10" max="60" />

                <label>رقم واتساب *</label>
                <input type= "tel" name="whatsapp"  required />

                <label>رقم الهاتف (اختياري)</label>
                <input type="tel" name="phone" />

                <label>معرف تليجرام (اختياري)</label>
                <input type="text" name="telegram" placeholder="@username" />

                <label>التخصص الجامعي/ المهنة *</label>
                <input type="text" name="profession" required />

                <button type="button" class="next-btn">التالي ➜</button>
            </div>

            <!-- ===== الخطوة 2: المهارات ===== -->
            <div class="step-page" data-step="1">
                <h2>🎯 المهارات والخبرات</h2>
                
                <label>ما هو التطبيق الذي تصمم به؟ *</label>
                <input type="text" name="designApp" placeholder="مثال: كانفا، فوتوشوب" required />

                <label>مستوى خبرتك في كانفا *</label>
                <select name="canvaLevel" required>
                    <option value="">-- اختر المستوى --</option>
                    <option value="مبتدئ">مبتدئ (أساسيات + قوالب)</option>
                    <option value="متوسط">متوسط (تعديل بصورة جيده)</option>
                    <option value="متوسط">إحترافي (  عمل إحترافي جدا)</option>
                    <option value="أخرى">أخرى</option>
                </select>

                <label>نوع حساب كانفا *</label>
                <select name="canvaAccount" required>
                    <option value="">-- اختر نوع الحساب --</option>
                    <option value="مجاني">مجاني</option>
                    <option value="مدفوع">مدفوع</option>
                </select>

                <label>هل سبق لك التطوع في تصميم لمبادرات سابقة؟ *</label>
                <select name="previousVolunteer" required>
                    <option value="">-- اختر --</option>
                    <option value="نعم">نعم</option>
                    <option value="لا">لا</option>
                </select>

                <div class="btn-group">
                    <button type="button" class="prev-btn">➜ السابق</button>
                    <button type="button" class="next-btn">التالي ➜</button>
                </div>
            </div>

            <!-- ===== الخطوة 3: رفع الأعمال ===== -->
            <div class="step-page" data-step="2">
                <h2>🖼️ معرض الأعمال</h2>
                
                <label>يرجى وضع رابط معرض أعمالك (Google Drive, Behance, Canva...) *</label>
<input type="url" name="portfolio" placeholder="https://drive.google.com/..." required /><p class="note">📌 ملاحظة: نماذج الأعمال هي المعيار الأساسي للتقييم</p>

                <div class="btn-group">
                    <button type="button" class="prev-btn">➜ السابق</button>
                    <button type="button" class="next-btn">التالي ➜</button>
                </div>
            </div>

            <!-- ===== الخطوة 4: الالتزام ===== -->
            <div class="step-page" data-step="3">
                <h2>✅ الالتزام والموافقة</h2>
                
                <label>هل لديك زمن محدد للعمل؟ إن كان نعم، اذكر الأوقات المناسبة</label>
                <textarea name="availableTime" rows="3" placeholder="مثال: مساءً بعد الساعة 8، أو في عطلة نهاية الأسبوع..."></textarea>

                <label class="checkbox-label">
                    <input type="checkbox" name="agree" required />
                    أوافق على أن أكون مشاركاً معكم وعضواً فعالاً *
                </label>

                <div class="btn-group">
                    <button type="button" class="prev-btn">➜ السابق</button>
                    <button type="submit" class="submit-btn">✅ إرسال</button>
                </div>
            </div>
        </form>
    </div>

    <!-- ===== جافا سكريبت في آخر الصفحة ===== -->
    <script src="script.js"></script>
</body>
</html>
